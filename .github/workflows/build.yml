name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle assembleRelease --console=plain --stacktrace > build.log 2>&1

      - name: Ringkasan error
        if: failure()
        run: |
          echo "=== ERROR KOTLIN / R8 ==="
          grep -E "^e: |ERROR:|Missing class|error:" build.log | head -40 || true
          echo "=== WHAT WENT WRONG ==="
          grep -A8 "What went wrong" build.log | head -30 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: GameSpace-release-apk
          path: app/build/outputs/apk/release/*.apk
